services:
  - type: web
    name: doc-converter
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install .
    startCommand: >-
      gunicorn converter.app:app
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 4
      --timeout 120
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Free instance has 512 MB RAM; keep uploads modest so conversions
      # don't OOM. Raise if you move to a paid plan.
      - key: CONVERTER_MAX_MB
        value: "25"
      - key: PYTHON_VERSION
        value: "3.12.5"
      # Live URL — keeps canonical / OG / sitemap links correct.
      - key: CONVERTER_SITE_URL
        value: "https://doc-converter-4vgm.onrender.com"
      # Optional: a free Upstash Redis makes the visit count survive restarts.
      # Create one at upstash.com and paste the REST URL + token here.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
