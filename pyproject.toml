[project]
name = "converter"
version = "0.1.0"
description = "Local web app to convert Markdown to DOCX and images to PDF"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "markdown>=3.6",
    "python-docx>=1.1",
    "htmldocx>=0.0.6",
    "beautifulsoup4>=4.12",
    "img2pdf>=0.5",
    "pillow>=10.3",
    "gunicorn>=21.2",
    "xhtml2pdf>=0.2.16",
]

[project.scripts]
converter = "converter.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/converter"]
